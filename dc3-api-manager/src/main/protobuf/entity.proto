syntax = "proto3";

package api.center.manager;

import "api/common/base.proto";
import "api/common/page.proto";
import "api/common/r.proto";

/*
Config
*/
option java_package = "io.github.pnoker.api.center.manager";
option java_outer_classname = "EntityProto";
option objc_class_prefix = "Entity";
option java_multiple_files = true;

/*
Driver
*/
message GrpcDriverDTO {
  /*
  Base
  */
  api.common.GrpcBase base = 1;

  /*驱动名称*/
  string driver_name = 2;
  string driver_code = 3; // 驱动编号
  string service_name = 4; // 驱动服务名称
  uint32 driver_type_flag = 5; // 驱动类型标识
  string service_host = 6; // 服务主机
  uint32 enable_flag = 7; // 使能标识

  /*
  Tenant ID
  */
  int64 tenant_id = 8;
}

/*
Device
*/
message GrpcDeviceDTO {
  /*
  Base
  */
  api.common.GrpcBase base = 1;

  string device_name = 2; // 位号名称
  string device_code = 3; // 位号编号
  int64 driver_id = 4; // 驱动ID
  int64 group_id = 5; // 分组ID
  uint32 enable_flag = 6; // 使能标识

  /*
  Tenant ID
  */
  int64 tenant_id = 7;
}

/*
Point
*/
message GrpcPointDTO {
  /*
  Base
  */
  api.common.GrpcBase base = 1;

  string point_name = 2; // 位号名称
  string point_code = 3; // 位号编号
  uint32 point_type_flag = 4; // 位号类型标识
  uint32 rw_flag = 5; // 读写标识
  double base_value = 6; // 基础值
  double multiple = 7; // 比例系数
  int32 value_decimal = 8; // 数据精度
  string unit = 9; // 单位
  int64 profile_id = 10; // 模板ID
  int64 group_id = 11; // 分组ID
  uint32 enable_flag = 12; // 使能标识

  /*
  Tenant ID
  */
  int64 tenant_id = 13;
}



